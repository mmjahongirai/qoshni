# Alembic configuration for QO'SHNI backend migrations.
# Run Alembic commands from the backend/ directory.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Database URL is resolved at runtime from application settings in alembic/env.py.
# Do not store credentials in this file.
# sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
