# Render Blueprint — QO'SHNI FastAPI backend only.
# The Flutter web frontend stays on Vercel; this file does not touch it.
#
# No database is attached yet and the container never runs migrations.
# Secrets are never stored here: generated by Render or entered in the
# dashboard.
services:
  - type: web
    name: qoshni-backend
    runtime: docker
    region: frankfurt
    # Free instances sleep when idle. Upgrade the plan in the dashboard
    # before real traffic.
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    # Rebuild only when backend files change, not on frontend commits.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: QOSHNI_ENVIRONMENT
        value: production
      # Required for production startup; ClamAV is only contacted on upload.
      - key: QOSHNI_MALWARE_SCANNER_PROVIDER
        value: clamav
      - key: QOSHNI_AUTH_SECRET_DIGEST_KEY
        generateValue: true
      - key: QOSHNI_CONSUMER_CATALOG_ENABLED
        value: "false"
      - key: QOSHNI_RESERVATION_MAINTENANCE_ENABLED
        value: "false"
      - key: QOSHNI_DATABASE_ECHO
        value: "false"
